name: Criar estrutura LUME

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  criar-lume:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Executar script de criação
        run: python criar_botql_ai_lab.py --nome LUME

      - name: Guardar estrutura no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LUME
          if git diff --cached --quiet; then
            echo "Não há alterações novas para guardar."
          else
            git commit -m "Criar estrutura inicial do LUME"
            git push
          fi
