name: Corrigir estrutura LUME

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir-lume:
    runs-on: ubuntu-latest

    steps:
      - name: Obter repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Corrigir extensões do LUME
        run: python corrigir_lume.py

      - name: Guardar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A LUME

          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária."
          else
            git commit -m "Corrigir extensões e estrutura do LUME"
            git push
          fi