<!doctype html>
<html lang=pt>
<head>
<meta charset=UTF-8>
<meta name=viewport content="width=device-width,initial-scale=1,user-scalable=no">
<title>{{BOT_NOME}}</title>
<style>
:root{--bg:#FFFFFF;--bg2:#FFFFFF;--bg3:#F7F7F7;--border:#E8E8E8;--text:#111111;--muted:#8A8A8A;--r:#111111;--on:#FFFFFF;--bot-texto:#111111;--bot-tamanho:16px}
.tema-escuro{--bg:#111111;--bg2:#1A1A1A;--bg3:#222222;--border:#333333;--text:#F2F2F2;--muted:#9A9A9A;--r:#F2F2F2;--on:#111111;--bot-texto:#F2F2F2}
*{margin:0;padding:0;box-sizing:border-box}
body,html{background:var(--bg);color:var(--text);font-family:-apple-system,'Inter',Roboto,'Segoe UI',Helvetica,Arial,sans-serif;height:100%;overflow:hidden;transition:background .2s,color .2s}
#statusbar{background:var(--bg);border-bottom:1px solid var(--border);height:56px;padding:0 16px;display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative;z-index:10}
#btn-menu{width:26px;height:26px;background:0 0;border:none;padding:0;cursor:pointer;flex-shrink:0}
#btn-menu svg{width:100%;height:100%}
#btn-menu svg path{stroke:var(--text)}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--r);color:var(--on);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0}
#statusbar .titulo{color:var(--text);font-weight:600;font-size:18px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat{flex:1;overflow-y:auto;padding:16px 16px 150px;display:flex;flex-direction:column;gap:14px;height:calc(100% - 56px)}
.msg{line-height:1.6;overflow-wrap:break-word;word-break:break-word;white-space:pre-line}
.msg.sistema{align-self:flex-start;color:var(--bot-texto);font-weight:400;font-size:var(--bot-tamanho);width:100%}
.msg.usuario{align-self:flex-end;max-width:85%;background:var(--bg3);color:var(--text);padding:10px 16px;border-radius:20px;font-size:16px;font-weight:400}
.msg.sistema.markdown{white-space:normal}
.msg.sistema.markdown p{margin:0 0 8px}
.msg.sistema.markdown p:last-child{margin-bottom:0}
.msg.sistema.markdown ol,.msg.sistema.markdown ul{margin:4px 0 8px;padding-left:22px}
.msg.sistema.markdown li{margin-bottom:2px}
.msg.sistema.markdown strong{font-weight:700}
.msg.sistema.markdown em{font-style:italic}
.msg.sistema.markdown a{color:var(--text);text-decoration:underline}
.msg.sistema.markdown code{background:var(--bg3);padding:2px 6px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.msg.sistema.markdown pre{background:var(--bg3);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin:8px 0;position:relative}
.msg.sistema.markdown pre code{display:block;background:0 0;padding:12px;overflow-x:auto;color:var(--text);border-radius:0}
.msg.sistema.markdown blockquote{border-left:3px solid var(--r);margin:6px 0;padding:2px 10px;opacity:.85}
.msg.sistema.markdown table{border-collapse:collapse;margin:8px 0;font-size:15px}
.msg.sistema.markdown td,.msg.sistema.markdown th{border:1px solid var(--border);padding:6px 10px;text-align:left}
.msg.sistema.markdown th{background:var(--bg3);font-weight:700}
.msg.sistema.markdown img{max-width:100%;height:auto;border-radius:10px}
.msg.sistema.markdown pre code.hljs{display:block;overflow-x:auto}
.msg.sistema.markdown .hljs{color:var(--text);background:transparent}
.msg.sistema.markdown .hljs-doctag,.msg.sistema.markdown .hljs-keyword,.msg.sistema.markdown .hljs-meta .hljs-keyword,.msg.sistema.markdown .hljs-template-tag,.msg.sistema.markdown .hljs-template-variable,.msg.sistema.markdown .hljs-type{color:#cf222e}
.msg.sistema.markdown .hljs-title{color:#8250df}
.msg.sistema.markdown .hljs-attr,.msg.sistema.markdown .hljs-attribute,.msg.sistema.markdown .hljs-literal,.msg.sistema.markdown .hljs-meta,.msg.sistema.markdown .hljs-number,.msg.sistema.markdown .hljs-selector-attr,.msg.sistema.markdown .hljs-selector-class,.msg.sistema.markdown .hljs-selector-id,.msg.sistema.markdown .hljs-variable{color:#0550ae}
.msg.sistema.markdown .hljs-meta .hljs-string,.msg.sistema.markdown .hljs-regexp,.msg.sistema.markdown .hljs-string{color:#0a3069}
.msg.sistema.markdown .hljs-built_in,.msg.sistema.markdown .hljs-class .hljs-title,.msg.sistema.markdown .hljs-symbol,.msg.sistema.markdown .hljs-title.class_{color:#953800}
.msg.sistema.markdown .hljs-code,.msg.sistema.markdown .hljs-comment,.msg.sistema.markdown .hljs-formula{color:#6e7781}
.msg.sistema.markdown .hljs-name,.msg.sistema.markdown .hljs-quote,.msg.sistema.markdown .hljs-selector-pseudo,.msg.sistema.markdown .hljs-selector-tag{color:#116329}
.msg.sistema.markdown .hljs-section{color:#0550ae;font-weight:700}
.msg.sistema.markdown .hljs-bullet{color:#953800}
.msg.sistema.markdown .hljs-emphasis{font-style:italic}
.msg.sistema.markdown .hljs-strong{font-weight:700}
.tema-escuro .msg.sistema.markdown .hljs-doctag,.tema-escuro .msg.sistema.markdown .hljs-keyword,.tema-escuro .msg.sistema.markdown .hljs-type{color:#ff7b72}
.tema-escuro .msg.sistema.markdown .hljs-title{color:#d2a8ff}
.tema-escuro .msg.sistema.markdown .hljs-attr,.tema-escuro .msg.sistema.markdown .hljs-attribute,.tema-escuro .msg.sistema.markdown .hljs-literal,.tema-escuro .msg.sistema.markdown .hljs-number,.tema-escuro .msg.sistema.markdown .hljs-variable{color:#79c0ff}
.tema-escuro .msg.sistema.markdown .hljs-regexp,.tema-escuro .msg.sistema.markdown .hljs-string{color:#a5d6ff}
.tema-escuro .msg.sistema.markdown .hljs-built_in,.tema-escuro .msg.sistema.markdown .hljs-symbol{color:#ffa657}
.tema-escuro .msg.sistema.markdown .hljs-comment{color:#8b949e}
.tema-escuro .msg.sistema.markdown .hljs-name,.tema-escuro .msg.sistema.markdown .hljs-selector-tag{color:#7ee787}
.msg.sistema.markdown [data-botql-categoria],.msg.sistema.markdown [data-botql-produto]{cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s;user-select:none}
.msg.sistema.markdown [data-botql-categoria]:active,.msg.sistema.markdown [data-botql-produto]:active{transform:scale(.98)}
.msg.sistema.markdown [data-botql-produto].selecionado{border:2px solid var(--r);box-shadow:0 0 0 2px rgba(0,0,0,.12);transform:scale(1.02)}
.msg.digitando{align-self:flex-start;padding:4px 0;display:flex;align-items:center;gap:5px;width:fit-content}
.msg.digitando .ponto{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite ease-in-out}
.msg.digitando .ponto:nth-child(2){animation-delay:.15s}
.msg.digitando .ponto:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%,60%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.msg-acoes{display:flex;align-items:center;gap:4px;margin:2px 0 6px;align-self:flex-start}
.msg-acao{width:30px;height:30px;border:none;background:0 0;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--muted)}
.msg-acao:active{background:var(--bg3)}
.msg-acao svg{width:16px;height:16px}
.msg-acao.ativo{color:var(--text)}
.msg-acao.ativo svg path{fill:var(--text)}
.cabecalho-codigo{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--border)}
.cabecalho-codigo .nome-linguagem{color:var(--muted);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;text-transform:lowercase}
.btn-copiar-codigo{background:0 0;border:none;padding:2px 4px;display:flex;align-items:center;gap:5px;cursor:pointer;color:var(--muted);font-family:inherit;font-size:13px}
.btn-copiar-codigo:active{color:var(--text)}
.btn-copiar-codigo svg{width:14px;height:14px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(10px);background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .4s var(--mola);z-index:960;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#input-area{position:fixed;left:0;right:0;bottom:0;padding:10px 16px 14px;background:var(--bg);flex-shrink:0;z-index:5}
.pv-pill{display:flex;flex-direction:column;gap:4px;background:var(--bg2);border:1px solid var(--border);border-radius:26px;padding:12px 12px 8px 16px}
.pv-pill{width:100%;max-width:720px;margin:0 auto}
.pv-linha-botoes{display:flex;align-items:center;gap:6px}
.pv-linha-botoes .pv-espaco{flex:1}
.pv-botao-redondo{width:36px;height:36px;flex-shrink:0;border:none;border-radius:50%;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pv-botao-redondo:active{background:var(--bg3)}
.pv-botao-redondo svg{width:20px;height:20px}
#chat-input{width:100%;border:none;background:0 0;font-family:inherit;font-size:16px;outline:0;color:var(--text);resize:none;overflow-y:auto;min-height:26px;max-height:120px;line-height:1.4;padding:2px 4px 8px}
#chat-input::placeholder{color:var(--muted)}
#btn-enviar-chat{background:var(--r);width:40px;height:40px}
#btn-enviar-chat:active{opacity:.8;background:var(--r)}
#btn-enviar-chat svg path{stroke:var(--on)}
#btn-enviar-chat:disabled{background:var(--bg3)}
#btn-enviar-chat:disabled svg path{stroke:var(--muted)}
#sidebar-overlay{display:block;visibility:hidden;opacity:0;pointer-events:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:900;transition:opacity .3s,visibility 0s .3s}
#sidebar-overlay.show{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .3s}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:82%;max-width:340px;background:var(--bg);z-index:910;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .45s cubic-bezier(.32,.72,0,1);box-shadow:4px 0 20px rgba(0,0,0,.15)}
#sidebar.show{transform:translateX(0)}
#sidebar-cabecalho{color:var(--text);font-weight:600;font-size:18px;padding:18px 16px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:1px solid var(--border)}
#sidebar-conteudo{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
#sidebar-conteudo button{background:transparent;border:none;border-radius:12px;padding:12px;text-align:left;font-family:inherit;font-size:16px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:14px;width:100%}
#sidebar-conteudo button:active{background:var(--bg3)}
.sidebar-icone{width:24px;height:24px;flex-shrink:0}
.sidebar-icone svg{width:100%;height:100%;display:block}
#sidebar-sobre{display:none!important}
#sidebar-conteudo .conversa-menu{width:26px;height:26px;padding:0;gap:0;justify-content:center;flex-shrink:0;border-radius:50%}
#sidebar-defs{display:none;flex:1;overflow-y:auto;padding:10px;flex-direction:column;gap:14px}
#sidebar.defs #sidebar-defs{display:flex}
#sidebar.defs #sidebar-conteudo,#sidebar.defs #sidebar-fixo{display:none}
#sidebar-defs .defs-voltar{background:transparent;border:none;border-radius:12px;padding:12px;text-align:left;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:14px;width:100%}
.defs-rotulo{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:0 6px 8px}
.defs-grupo{padding:0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:transparent;border:1px solid var(--border);border-radius:999px;padding:10px 16px;font-family:inherit;font-size:15px;font-weight:500;color:var(--text);cursor:pointer}
button.chip:active{background:var(--bg3)}
.chip.ativo{background:var(--r);border-color:var(--r);color:var(--on)}
#sidebar-fixo{flex-shrink:0;padding:8px 10px;border-top:1px solid var(--border)}
#sidebar-fixo button{background:transparent;border:none;border-radius:12px;padding:12px;text-align:left;font-family:inherit;font-size:16px;font-weight:500;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:14px;width:100%}
#sidebar-fixo button:active{background:var(--bg3)}
.sidebar-separador{border:none;border-top:1px solid var(--border);margin:6px 4px}
#sidebar-rodape{flex-shrink:0;padding:12px 16px 16px;border-top:1px solid var(--border);background:var(--bg)}
#sidebar-rodape a{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--r);color:var(--on);text-decoration:none;border-radius:999px;padding:12px 16px;font-size:15px;font-weight:600}
#sidebar-rodape a:active{opacity:.85}
.sobre-rotulo{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:4px 6px 6px}
.sobre-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 6px;font-size:15px;color:var(--text)}
.sobre-linha b{font-weight:600}
#sidebar-rodape .marca-titulo{font-size:16px;font-weight:600;color:var(--text);text-align:center;margin-bottom:4px}
#sidebar-rodape .marca-texto{font-size:13px;color:var(--muted);text-align:center;line-height:1.4;margin-bottom:10px}
#modal-overlay{display:flex;visibility:hidden;opacity:0;pointer-events:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:950;align-items:center;justify-content:center;padding:24px;transition:opacity .2s,visibility 0s .2s}
#modal-overlay.show{visibility:visible;opacity:1;pointer-events:auto;transition:opacity .2s}
#modal-caixa{transform:scale(.9) translateY(12px);opacity:0;transition:transform .2s,opacity .2s}
#modal-overlay.show #modal-caixa{transform:none;opacity:1;transition:transform .4s var(--mola),opacity .2s}
#modal-caixa{width:100%;max-width:380px;background:var(--bg);border-radius:20px;overflow:hidden;padding:22px 22px 20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
#modal-cabecalho{color:var(--text);font-weight:600;font-size:20px;padding:0 0 8px}
#modal-corpo{padding:0 0 18px;font-size:15px;font-weight:400;line-height:1.5;color:var(--muted);white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow-y:auto}
#modal-rodape{padding:0;display:flex;flex-direction:row;flex-wrap:wrap;gap:10px}
#modal-rodape button{flex:1;min-width:0}
#modal-rodape button{background:transparent;border:1px solid var(--border);border-radius:999px;padding:14px 18px;font-family:inherit;font-size:16px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:10px;align-self:stretch;justify-content:center}
#modal-rodape button:active{opacity:.8}
#modal-rodape button.primario,#modal-rodape button.destrutivo{background:var(--r);border-color:var(--r);color:var(--on)}
#modal-rodape .modal-icone{display:none}
#modal-rodape .modal-icone svg{width:100%;height:100%;display:block}
#modal-rodape button.primario .modal-icone svg,#modal-rodape button.destrutivo .modal-icone svg{stroke:var(--on)}
#tela-carregando{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:999;color:var(--muted);font-size:14px;font-weight:600;text-align:center;padding:30px}
#tela-carregando .spinner-grande{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--r);border-radius:50%;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
.conversas-rotulo{font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--muted);padding:10px 6px 4px}
#lista-conversas{display:flex;flex-direction:column;gap:4px}
.conversa-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;background:transparent;border:1px solid transparent;transition:background .15s;user-select:none}
.conversa-item:active{background:var(--bg3)}
.conversa-item.ativa{background:var(--bg3)}
.conversa-item-conteudo{flex:1;min-width:0}
.conversa-titulo{font-size:15px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.conversa-data{font-size:12px;color:var(--muted)}
.conversa-menu{width:26px;height:26px;flex-shrink:0;border:none;background:transparent;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;color:var(--muted)}
.conversa-menu:active{background:var(--border)}
.conversa-menu svg{width:16px;height:16px}
.conversas-vazio{font-size:14px;color:var(--muted);font-style:italic;padding:12px 8px;text-align:center}
:root{--mola:cubic-bezier(.34,1.56,.64,1)}
button{transition:transform .2s var(--mola),background-color .2s,color .2s,border-color .2s,opacity .2s}
button:active{transform:scale(.94)}
@keyframes entrar{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes entrarUsuario{from{opacity:0;transform:translateY(10px) scale(.88)}to{opacity:1;transform:none}}
@keyframes entrarEsq{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:none}}
@keyframes entrarDir{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.msg.sistema,.msg-acoes,.msg.digitando{animation:entrar .45s var(--mola) both}
.msg.usuario{transform-origin:100% 100%;animation:entrarUsuario .4s var(--mola) both}
.conversa-item{animation:entrarEsq .4s var(--mola) both}
.conversa-item:nth-child(2){animation-delay:.04s}
.conversa-item:nth-child(3){animation-delay:.08s}
.conversa-item:nth-child(4){animation-delay:.12s}
.conversa-item:nth-child(5){animation-delay:.16s}
#sidebar-conteudo,#sidebar-fixo{animation:entrarEsq .35s var(--mola) both}
#sidebar-defs{animation:entrarDir .35s var(--mola) both}
.defs-grupo{animation:entrarDir .4s var(--mola) both}
.defs-grupo:nth-child(3){animation-delay:.05s}
.defs-grupo:nth-child(4){animation-delay:.1s}
.msg-acao.ativo svg{animation:pop .35s var(--mola)}
.chip.ativo{animation:pop .3s var(--mola)}
.pv-pill{transition:border-color .2s,box-shadow .2s}
.pv-pill:focus-within{border-color:var(--muted);box-shadow:0 2px 14px rgba(0,0,0,.08)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id=tela-carregando>
<div class=spinner-grande></div>
<div id=texto-carregando>A preparar o bot...</div>
</div>
<div id=statusbar>
<button id=btn-menu onclick=abrirSidebar() aria-label=Menu>
<svg viewBox="0 0 24 24" fill=none><path d="M4 7h16M4 12h16M4 17h16" stroke=#fff stroke-width=2 stroke-linecap=round /></svg>
</button>
<span class=avatar id=avatar>L</span>
<span class=titulo id=titulo>{{BOT_NOME}}</span>
</div>
<div id=chat></div>
<div id=input-area>
<div class=pv-pill>
<textarea id=chat-input placeholder="Escreva uma mensagem..." autocomplete=off spellcheck=false rows=1 enterkeyhint=enter></textarea>
<div class=pv-linha-botoes>
<button class=pv-botao-redondo onclick=anexarFicheiro() aria-label=Anexar>
<svg viewBox="0 0 24 24" fill=none><path d="M12 5v14M5 12h14" stroke=#8A8A8A stroke-width=2 stroke-linecap=round /></svg>
</button>
<span class=pv-espaco></span>
<button class=pv-botao-redondo onclick=mensagemVoz() aria-label="Mensagem de voz">
<svg viewBox="0 0 24 24" fill=none><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" stroke=#8A8A8A stroke-width=2 /><path d="M6 11a6 6 0 0 0 12 0M12 17v3" stroke=#8A8A8A stroke-width=2 stroke-linecap=round /></svg>
</button>
<button id=btn-enviar-chat class=pv-botao-redondo onclick=enviar() aria-label=Enviar>
<svg viewBox="0 0 24 24" fill=none><path d="M12 19V5M6 11l6-6 6 6" stroke=#fff stroke-width=2.4 stroke-linecap=round stroke-linejoin=round /></svg>
</button>
</div>
</div>
</div>
<div id=sidebar-overlay onclick=fecharSidebar()></div>
<div id=sidebar>
<div id=sidebar-cabecalho>{{BOT_NOME}}</div>
<div id=sidebar-conteudo>
<button onclick="novaConversa()">
<span class=sidebar-icone><svg viewBox="0 0 24 24" fill=none><path d="M12 5v14M5 12h14" stroke=#8A8A8A stroke-width=2 stroke-linecap=round /></svg></span>
Nova conversa
</button>
<div class="conversas-rotulo">Conversas</div>
<div id="lista-conversas"></div>
<div id=sidebar-sobre style=display:none>
<hr class=sidebar-separador>
<div class=sobre-rotulo>Sobre este bot</div>
<div class=sobre-linha><span>Atualizado em</span><b id=sobre-data>-</b></div>
</div>
</div>
<div id=sidebar-defs>
<button class=defs-voltar onclick=fecharDefinicoes()>
<span class=sidebar-icone><svg viewBox="0 0 24 24" fill=none><path d="M15 5l-7 7 7 7" stroke=#8A8A8A stroke-width=2 stroke-linecap=round stroke-linejoin=round /></svg></span>
