<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Editor do Lume</title>
<!--
  Mini editor/navegador do Lume. Corre dentro de uma iframe isolada (sandbox) aberta pelo
  chat (LUME/editor/lume-editor.js). Nao tem acesso ao chat: pede copiar, descarregar e
  fechar ao chat por postMessage. O site em si corre numa segunda iframe isolada, com CSP
  sem rede.
-->
<style>
:root{--bg:#f6f7ee;--card:#ffffff;--text:#1d2410;--border:#c9ceb8;--muted:#5c6b3a;--r:#4a6a10;--on:#ffffff;--code-bg:#eef0e2}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.top{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--border);background:var(--card)}
.nome{flex:1;min-width:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.b{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer}
.b.on{background:var(--r);color:var(--on)}
.corpo{flex:1;min-height:0;position:relative}
.corpo iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
pre{position:absolute;inset:0;margin:0;padding:14px;overflow:auto;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre;tab-size:2;background:var(--code-bg);color:var(--text)}
#fundo{position:fixed;inset:0;z-index:10;display:none}
#menu{position:fixed;z-index:11;min-width:236px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.14),0 24px 64px rgba(0,0,0,.18);display:none}
.item{display:flex;align-items:center;gap:16px;width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:16px;padding:13px 14px;border-radius:14px;cursor:pointer;text-align:left}
.item:active{background:var(--code-bg)}
.item svg{flex:none;color:var(--muted)}
</style>
</head>
<body>
<div class="top">
  <button class="b" id="fechar" aria-label="Fechar"></button>
  <div class="nome" id="nome"></div>
  <button class="b" id="bsite" aria-label="Ver o site"></button>
  <button class="b" id="bcod" aria-label="Ver código fonte"></button>
  <button class="b" id="bmais" aria-label="Mais opções"></button>
</div>
<div class="corpo" id="corpo"></div>
<div id="fundo"></div>
<div id="menu"></div>
<script>
(function(){
var CSP='<meta http-equiv="Content-Security-Policy" content="default-src \'none\'; img-src data: https:; style-src \'unsafe-inline\'; script-src \'unsafe-inline\'; font-src data:">';
var S='fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
var IC={
 fechar:'<svg viewBox="0 0 24 24" width="22" height="22" '+S+'><path d="M6 6l12 12M18 6L6 18"/></svg>',
 site:'<svg viewBox="0 0 24 24" width="20" height="20" '+S+'><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>',
 cod:'<svg viewBox="0 0 24 24" width="20" height="20" '+S+'><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>',
 mais:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>',
 cop:'<svg viewBox="0 0 24 24" width="20" height="20" '+S+'><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></svg>',
 baixar:'<svg viewBox="0 0 24 24" width="20" height="20" '+S+'><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>',
 rec:'<svg viewBox="0 0 24 24" width="20" height="20" '+S+'><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>'
};
var $=function(i){return document.getElementById(i)};
var h="",nome="app.html",fr=null,pre=null;
function enviar(m){m.lumeEd=m.lumeEd||"";parent.postMessage(m,"*")}
function comSeguranca(x){return/<head[^>]*>/i.test(x)?x.replace(/<head[^>]*>/i,function(m){return m+CSP}):"<!doctype html><head>"+CSP+"</head>"+x}
function iframe(){
 if(fr)fr.remove();
 fr=document.createElement("iframe");fr.setAttribute("sandbox","allow-scripts");fr.srcdoc=comSeguranca(h);$("corpo").appendChild(fr);
}
function mostrar(w){
 $("bsite").classList.toggle("on",w==="site");$("bcod").classList.toggle("on",w==="cod");
 if(w==="site"){if(pre)pre.style.display="none";if(!fr)iframe();fr.style.display="block"}
 else{if(fr)fr.style.display="none";if(!pre){pre=document.createElement("pre");var c=document.createElement("code");c.textContent=h;pre.appendChild(c);$("corpo").appendChild(pre)}pre.style.display="block"}
}
function fecharMenu(){$("menu").style.display="none";$("fundo").style.display="none"}
function abrirMenu(){
 var m=$("menu");m.innerHTML="";
 [["Copiar código",IC.cop,function(){enviar({lumeEd:"copiar",texto:h,msg:"Código copiado"})}],
  ["Copiar como Markdown",IC.cop,function(){enviar({lumeEd:"copiar",texto:"```html\n"+h+"\n```",msg:"Markdown copiado"})}],
  ["Transferir como HTML (.html)",IC.baixar,function(){enviar({lumeEd:"baixar",nome:nome,conteudo:h,mime:"text/html"})}],
  ["Transferir como texto (.txt)",IC.baixar,function(){enviar({lumeEd:"baixar",nome:nome.replace(/\.html$/,".txt"),conteudo:h,mime:"text/plain"})}],
  ["Recarregar o site",IC.rec,function(){mostrar("site");iframe()}]
 ].forEach(function(it){
  var b=document.createElement("button");b.type="button";b.className="item";b.innerHTML=it[1];
  var s=document.createElement("span");s.textContent=it[0];b.appendChild(s);
  b.addEventListener("click",function(e){e.stopPropagation();fecharMenu();it[2]()});m.appendChild(b);
 });
 $("fundo").style.display="block";m.style.display="block";
 var r=$("bmais").getBoundingClientRect();
 m.style.left=Math.max(12,Math.min(r.right-m.offsetWidth,innerWidth-m.offsetWidth-12))+"px";m.style.top=(r.bottom+6)+"px";
}
$("fechar").innerHTML=IC.fechar;$("bsite").innerHTML=IC.site;$("bcod").innerHTML=IC.cod;$("bmais").innerHTML=IC.mais;
$("fechar").addEventListener("click",function(){enviar({lumeEd:"fechar"})});
$("bsite").addEventListener("click",function(){mostrar("site")});
$("bcod").addEventListener("click",function(){mostrar("cod")});
$("bmais").addEventListener("click",abrirMenu);
$("fundo").addEventListener("click",fecharMenu);
window.addEventListener("message",function(e){
 var d=e.data;if(!d||d.lumeAbrir!==true||typeof d.html!=="string"||e.source!==parent)return;
 h=d.html;nome=String(d.nome||"app.html");$("nome").textContent=nome;
 if(d.tema&&typeof d.tema==="object")Object.keys(d.tema).forEach(function(k){if(/^--[a-z-]+$/.test(k)&&typeof d.tema[k]==="string")document.documentElement.style.setProperty(k,d.tema[k])});
 mostrar("site");
});
enviar({lumeEd:"pronto"});
})();
</script>
</body>
</html>
